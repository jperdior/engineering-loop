name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck every script
        run: |
          docker run --rm -e LC_ALL=C.UTF-8 -v "$PWD:/repo" -w /repo koalaman/shellcheck-alpine:stable \
            sh -c 'shellcheck --format=gcc $(find loop tests -name "*.sh" -type f | sort) $(find tests/stubs -type f | sort)'

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update -q && sudo apt-get install -y -q jq
      - name: Stub claude and gh on PATH
        run: |
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexit 0\n' > "$HOME/bin/claude"; chmod +x "$HOME/bin/claude"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: The loop
        run: bash tests/test-delivery-loop.sh
      - name: The parsers and measurements
        run: |
          bash tests/test-parse-ledger.sh
          bash tests/test-unit-size.sh
          bash tests/test-reclaim-worktree.sh
          bash tests/test-setup-wizard.sh
          bash tests/test-skills-frontmatter.sh
